<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <filter id="placeholder-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="1.5" flood-color="#555555" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="rotate(-24 500 350)">
    <!-- Shadow / outline layer -->
    <text 
      x="503" 
      y="353" 
      text-anchor="middle" 
      dominant-baseline="central" 
      font-family="'Brygada 1918', 'Liberation Serif', 'Times New Roman', 'DejaVu Serif', serif" 
      font-weight="800" 
      font-size="112" 
      letter-spacing="5" 
      fill="#6b2612" 
      opacity="0.5"
    >
      PLACEHOLDER
    </text>
    <!-- Foreground text -->
    <text 
      x="500" 
      y="350" 
      text-anchor="middle" 
      dominant-baseline="central" 
      font-family="'Brygada 1918', 'Liberation Serif', 'Times New Roman', 'DejaVu Serif', serif" 
      font-weight="800" 
      font-size="112" 
      letter-spacing="5" 
      fill="#EB4C22" 
      stroke="#B33310" 
      stroke-width="2" 
      stroke-linejoin="round"
    >
      PLACEHOLDER
    </text>
  </g>
</svg>
